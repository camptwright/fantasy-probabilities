name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # tests/conftest.py's `db` fixture (used by nearly every test file) talks
    # to a real Postgres instance and TRUNCATEs it before each test - not a
    # mock. Constraint #13 (CLAUDE.md): Alembic's --sql offline mode only
    # proves migration code runs, not that Postgres accepts the DDL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: fantasy_edge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Matches conftest.py's TEST_DATABASE_URL default exactly - both this
      # and the migration step below point at the same service-container DB.
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: changeme
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: fantasy_edge_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install "ruff>=0.8,<1"

      - name: Lint Python
        run: ruff check src config scripts

      - name: Compile Python
        run: python -m compileall -q src config scripts

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
