# Maps ESPN's own team abbreviation to its canonical displayName + espn_id.
# There is no nflverse equivalent for college football, so (unlike nfl.yaml,
# which maps nflverse's abbreviations) this file's own keys ARE the ESPN
# abbreviation - both are ESPN-sourced.
#
# Built live 2026-08-29 by unioning ESPN's college-football scoreboard
# (`?groups=80`) across every Saturday of the 2025 season, then keeping only
# teams appearing in at least 6 of the 14 sampled weeks. `groups=80` on the
# scoreboard endpoint returns every game with at least one FBS participant,
# not games between two FBS teams only, so a raw union include roughly 90
# one-off FCS teams played as early-season "buy games" - real FBS teams play
# nearly every week, so the appearance-count threshold is what actually
# isolates the 138-team FBS set, not the groups filter alone. (The `teams`
# endpoint itself ignores `groups` entirely - verified live, it always
# returns the same alphabetical slice regardless of the parameter's value.)
